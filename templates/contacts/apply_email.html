<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Заявка на участие</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f1f7;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f1f7;">
	<tr>
		<td align="center" style="padding:32px 12px;">
			<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:600px; background-color:#ffffff; border-radius:12px; overflow:hidden;">

				<!-- Шапка -->
				<tr>
					<td style="background-color:#160D32; padding:32px 40px;">
						<div style="font-family:Calibri,'Segoe UI',Arial,sans-serif; font-size:12px; font-weight:bold; letter-spacing:3px; text-transform:uppercase; color:#d1bee1; padding-bottom:10px;">Сфера дизайна &middot; sd43.ru</div>
						<h1 style="margin:0; font-family:Corbel,Calibri,'Segoe UI',Arial,sans-serif; font-size:26px; font-weight:600; line-height:1.3; color:#ffffff;">Заявка на участие<br>в выставке «Сфера дизайна»</h1>
					</td>
				</tr>

				<!-- Тело -->
				<tr>
					<td style="padding:36px 40px;">
						<p style="margin:0 0 28px; font-family:Calibri,'Segoe UI',Arial,sans-serif; font-size:15px; line-height:1.6; color:#555555;">Заявка отправлена через форму на сайте <a href="https://sd43.ru" style="color:#160D32; font-weight:bold; text-decoration:underline;">sd43.ru</a></p>

						<!-- Карточка с данными -->
						<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e0ee; border-radius:10px; overflow:hidden; margin-bottom:28px;">
							<tr>
								<td width="170" style="padding:14px 20px; background-color:#f4f1f7; border-bottom:1px solid #e5e0ee; font-family:Calibri,'Segoe UI',Arial,sans-serif; font-size:13px; color:#555555;">Имя отправителя</td>
								<td style="padding:14px 20px; border-bottom:1px solid #e5e0ee; font-family:Calibri,'Segoe UI',Arial,sans-serif; font-size:15px; color:#222222;"><b>{{name}}</b></td>
							</tr>
							<tr>
								<td width="170" style="padding:14px 20px; background-color:#f4f1f7; border-bottom:1px solid #e5e0ee; font-family:Calibri,'Segoe UI',Arial,sans-serif; font-size:13px; color:#555555;">E-mail</td>
								<td style="padding:14px 20px; border-bottom:1px solid #e5e0ee; font-family:Calibri,'Segoe UI',Arial,sans-serif; font-size:15px; color:#222222;"><a href="mailto:{{email}}" style="color:#160D32; text-decoration:none;"><b>{{email}}</b></a></td>
							</tr>
							{% if phone %}
							<tr>
								<td width="170" style="padding:14px 20px; background-color:#f4f1f7; border-bottom:1px solid #e5e0ee; font-family:Calibri,'Segoe UI',Arial,sans-serif; font-size:13px; color:#555555;">Телефон</td>
								<td style="padding:14px 20px; border-bottom:1px solid #e5e0ee; font-family:Calibri,'Segoe UI',Arial,sans-serif; font-size:15px; color:#222222;"><b>{{phone}}</b></td>
							</tr>
							{% endif %}
						</table>

						<!-- Сообщение -->
						<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
							<tr>
								<td style="padding:20px 24px; background-color:#faf8fc; border-left:4px solid #d1bee1; border-radius:0 8px 8px 0;">
									<div style="font-family:Calibri,'Segoe UI',Arial,sans-serif; font-size:12px; font-weight:bold; letter-spacing:2px; text-transform:uppercase; color:#160D32; padding-bottom:8px;">Сообщение</div>
									<p style="margin:0; font-family:Calibri,'Segoe UI',Arial,sans-serif; font-size:15px; line-height:1.7; color:#222222; white-space:pre-wrap;">{{message}}</p>
								</td>
							</tr>
						</table>
					</td>
				</tr>

				<!-- Подвал -->
				<tr>
					<td style="padding:20px 40px; background-color:#f4f1f7; border-top:1px solid #e5e0ee;">
						<p style="margin:0; font-family:Calibri,'Segoe UI',Arial,sans-serif; font-size:12px; color:#999999;">Это автоматическое уведомление выставки «Сфера дизайна» · <a href="https://sd43.ru" style="color:#d1bee1; text-decoration:none;">sd43.ru</a></p>
					</td>
				</tr>

			</table>
		</td>
	</tr>
</table>
</body>
</html>
